# XcodeGen definition (spec 016). The .xcodeproj is generated and git-ignored:
#   xcodegen && open TidyMyMac.xcodeproj
name: TidyMyMac
options:
  bundleIdPrefix: io.github.joswalt
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
configFiles:
  Debug: Config/Shared.xcconfig
  Release: Config/Shared.xcconfig
packages:
  TidyCore:
    path: Packages/TidyCore
targets:
  TidyMyMac:
    type: application
    platform: macOS
    sources:
      - path: App
        excludes:
          - "Info.plist"
          - "LaunchDaemons/**"
          - "**/*.md"
      - path: App/LaunchDaemons/io.github.joswalt.TidyMyMac.Helper.plist
        buildPhase:
          copyFiles:
            destination: wrapper
            subpath: Contents/Library/LaunchDaemons
      - path: Rules
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: TidyMyMac
        PRODUCT_BUNDLE_IDENTIFIER: $(TIDY_APP_BUNDLE_ID)
        INFOPLIST_FILE: App/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        COMBINE_HIDPI_IMAGES: YES
    dependencies:
      # The helper ships inside the app at Contents/MacOS/TidyMyMacHelper (spec 005 §3).
      - target: TidyMyMacHelper
        copy:
          destination: executables
        codeSign: false
      # Every TidyCore library except HelperCore (spec 016 §3).
      - package: TidyCore
        product: SafetyFloor
      - package: TidyCore
        product: HelperProtocol
      - package: TidyCore
        product: RuleEngine
      - package: TidyCore
        product: AppInventory
      - package: TidyCore
        product: DiskAnalysis
      - package: TidyCore
        product: SystemTasks
      - package: TidyCore
        product: Monitors
      - package: TidyCore
        product: RunLog

  TidyMyMacHelper:
    type: tool
    platform: macOS
    sources:
      - path: Helper
    settings:
      base:
        PRODUCT_NAME: TidyMyMacHelper
        PRODUCT_BUNDLE_IDENTIFIER: $(TIDY_HELPER_BUNDLE_ID)
        # Embed an Info.plist so codesign uses the bundle ID as the signing identifier,
        # which the app's code-signing requirement checks (spec 005 §9).
        GENERATE_INFOPLIST_FILE: YES
        CREATE_INFOPLIST_SECTION_IN_BINARY: YES
        SKIP_INSTALL: YES
    dependencies:
      - package: TidyCore
        product: HelperProtocol
      - package: TidyCore
        product: HelperCore
