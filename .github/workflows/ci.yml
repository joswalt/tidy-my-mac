# CI (spec 017 §3, D3): every pull request, unsigned, no secrets.
name: CI
on:
  pull_request:
  workflow_dispatch:
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-test:
    runs-on: macos-26
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Select the newest Xcode
        run: |
          XCODE=$(ls -d /Applications/Xcode*.app | sort -V | tail -1)
          echo "Using $XCODE"
          sudo xcode-select -s "$XCODE"
          xcodebuild -version
          swift --version
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Package tests
        run: swift test --package-path Packages/TidyCore
      - name: Rule lint
        run: scripts/lint-rules.sh
      - name: Safety lint
        run: scripts/safety-lint.sh
      - name: Unsigned app + helper build
        run: |
          xcodegen generate
          xcodebuild -project TidyMyMac.xcodeproj -scheme TidyMyMac -configuration Debug \
            -derivedDataPath build/DerivedData build CODE_SIGNING_ALLOWED=NO
